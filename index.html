<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>404 - Page introuvable</title>
  <!-- Police Montserrat depuis Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      background-color: #f4f4f4;
      /* Image de fond logo via URL */
      background-image: url('https://cdn-icons-png.flaticon.com/512/6744/6744934.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 150px 150px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #444;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 4rem;
      color: #d32f2f;
      margin-bottom: 0.2em;
      font-weight: 700;
      text-shadow: 1px 1px 2px #aaa;
    }
    p {
      font-size: 1.5rem;
      margin-bottom: 1.5em;
      font-weight: 400;
    }
    a {
      display: inline-block;
      padding: 12px 28px;
      background-color: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1.2rem;
      transition: background-color 0.3s ease;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }
    a:hover {
      background-color: #0d47a1;
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 3rem;
      }
      p {
        font-size: 1.2rem;
      }
      a {
        font-size: 1rem;
        padding: 10px 20px;
      }
      body {
        background-size: 100px 100px;
      }
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Désolé, page introuvable.</p>
  <a href="https://youtu.be/SQmkxuSZ7fA?feature=shared"_blank" rel="noopener noreferrer">
    Plus d`informations 
  </a>
</body>
</html>
